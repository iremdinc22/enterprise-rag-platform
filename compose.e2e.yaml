# Standalone test stack: never merge with compose.yaml or use the development env file.
x-test: &test
  image: enterprise-rag-e2e:task028-1
  build:
    context: .
  init: true
  environment:
    E2E_ISOLATED: "1"
    PYTHON_DOTENV_DISABLED: "1"
    OPENAI_API_KEY: e2e-not-an-api-key
    QDRANT_URL: http://qdrant:6333
    QDRANT_COLLECTION: e2e_task028
    REDIS_CACHE_URL: redis://redis:6379/2
    REDIS_JOBS_URL: redis://redis:6379/1
    CELERY_BROKER_URL: redis://redis:6379/0
    GENERATION_MODEL: gpt-4.1-mini
    EMBEDDING_MODEL: text-embedding-3-small
    HF_HUB_OFFLINE: "1"
    TRANSFORMERS_OFFLINE: "1"
    RAG_TRACING_ENABLED: "false"
  networks: [isolated]
  depends_on:
    qdrant: {condition: service_healthy}
    redis: {condition: service_healthy}
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]

services:
  qdrant:
    image: qdrant/qdrant@sha256:12364fe851b9f17356fc88189fc06d1b521262e04659ec7345975b00c9246a10
    networks: [isolated]
    tmpfs: [/qdrant/storage]
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333; printf \"GET /readyz HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n\" >&3; read -r response <&3; [[ $$response == *\"200\"* ]]'"]
      interval: 2s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7.4-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    command: [redis-server, --save, "", --appendonly, "no"]
    networks: [isolated]
    tmpfs: [/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      timeout: 3s
      retries: 20
  worker:
    <<: *test
    command: [python, -m, tests.e2e.worker]
    stop_grace_period: 20s
  e2e:
    <<: *test
    command: [python, -m, tests.e2e.run]

networks:
  isolated:
    internal: true
